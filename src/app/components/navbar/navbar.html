<nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="navbar-inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar-logo" aria-label="J&B's Tropical Leaf Corner - Home" (click)="closeMenu()">
      <img src="assets/remodel/logo.png" alt="J&B's Tropical Leaf Corner logo" class="logo-img" />
    </a>

    <!-- Desktop Nav Links -->
    <ul class="nav-links" role="menubar">
      @for (link of navLinks(); track link.path) {
        <li role="none">
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="nav-link"
            role="menuitem"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Icon Actions -->
    <div class="nav-actions">
      <button class="nav-icon-btn" aria-label="Search" id="nav-search-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
      </button>
      <button class="nav-icon-btn" aria-label="User profile" id="nav-profile-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
      <button class="nav-icon-btn" aria-label="Shopping cart" id="nav-cart-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/>
          <circle cx="19" cy="21" r="1"/>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
      </button>

      <!-- Mobile Hamburger -->
      <button
        class="hamburger-btn"
        aria-label="Toggle mobile menu"
        [attr.aria-expanded]="mobileMenuOpen()"
        id="nav-hamburger-btn"
        (click)="toggleMenu()"
      >
        <span class="hamburger-line" [class.open]="mobileMenuOpen()"></span>
        <span class="hamburger-line" [class.open]="mobileMenuOpen()"></span>
        <span class="hamburger-line" [class.open]="mobileMenuOpen()"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  @if (mobileMenuOpen()) {
    <div class="mobile-menu-overlay" (click)="closeMenu()"></div>
    <div class="mobile-menu" role="menu">
      @for (link of navLinks(); track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="mobile-nav-link"
          role="menuitem"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </div>
  }
</nav>
